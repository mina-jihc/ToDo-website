<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <h1>JS Tasks</h1>

    <section class="section">
      <h2>Таsk 1. Functions</h2>

      <div class="cards">

        <!-- Function 1: sum of two numbers -->
        <div class="card">
          <h3>1. Sum of two numbers</h3>
          <input type="number" id="num1" placeholder="Num 1">
          <input type="number" id="num2" placeholder="Num 2">
          <button id="btn1">Calculate</button>
          <p class="result" id="result1"></p>
        </div>

        <!-- Function 2:  Even or odd-->
        <div class="card">
          <h3>2. Even or odd</h3>
          <input type="number" id="input2" placeholder="Enter num">
          <button id="btn2">Check</button>
          <p class="result" id="result2"></p>
        </div>

        <!-- Function 3: Max num in the array -->
        <div class="card">
          <h3>3. Max in array</h3>
          <input type="text" id="input3" placeholder="Числа через запятую: 3, 8, 1">
          <button id="btn3">Найти</button>
          <p class="result" id="result3"></p>
        </div>

        <!-- Function 4: перевернуть строку -->
        <div class="card">
          <h3>4. Перевернуть строку</h3>
          <input type="text" id="input4" placeholder="Введите текст">
          <button id="btn4">Перевернуть</button>
          <p class="result" id="result4"></p>
        </div>

        <!-- Function 5: посчитать гласные -->
        <div class="card">
          <h3>5. Количество гласных</h3>
          <input type="text" id="input5" placeholder="Введите текст">
          <button id="btn5">Посчитать</button>
          <p class="result" id="result5"></p>
        </div>

        <!-- Function 6: Factorial -->
        <div class="card">
          <h3>6. Factorial</h3>
          <input type="number" id="input6" placeholder="Your num">
          <button id="btn6">Calculate</button>
          <p class="result" id="result6"></p>
        </div>

        <!-- Function 7: Palindrome -->
        <div class="card">
          <h3>7. Palindrome</h3>
          <input type="text" id="input7" placeholder="Your word...">
          <button id="btn7">Check</button>
          <p class="result" id="result7"></p>
        </div>

        <!-- Function 8: The first letter of each word is capitalized -->
        <div class="card">
          <h3>8. Capital letters</h3>
          <input type="text" id="input8" placeholder="Type your sentence">
          <button id="btn8">Change</button>
          <p class="result" id="result8"></p>
        </div>

        <!-- Function 9: sum of the numbers in an array -->
        <div class="card">
          <h3>9. Sum of the array</h3>
          <input type="text" id="input9" placeholder="Numbers separated by commas: 1, 2, 3">
          <button id="btn9">Calculate</button>
          <p class="result" id="result9"></p>
        </div>

        <!-- Function 10: Celcius to Fahrenheit -->
        <div class="card">
          <h3>10. Celcius to Fahrenheit</h3>
          <input type="number" id="input10" placeholder="Celcius °C">
          <button id="btn10">Change</button>
          <p class="result" id="result10"></p>
        </div>

      </div>
    </section>

    <!-- ===== ТАSК 2: fetch from API ===== -->
    <section class="section">
      <h2>Таск 2. Data from API</h2>

      <button id="loadBtn">Load data</button>
      <p class="result" id="status"></p>

      <div id="posts"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
